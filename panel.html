<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", "Yu Gothic UI", sans-serif; user-select: none; }
  body { background: #1b1e24; color: #e8eaee; }
  body.dragging { background: transparent; cursor: col-resize; }
  body.dragging .bar, body.dragging .divider { display: none; }
  .divider { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; background: #2c313b; }
  .divider:hover { background: #f0a640; }
  .bar { position: absolute; left: 6px; right: 0; top: 0; height: 38px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid #2c313b; }
  .bar button {
    background: none; border: 0; color: #c9ced6; font-size: 15px; width: 30px; height: 28px; border-radius: 6px; cursor: pointer;
    display: grid; place-items: center;
  }
  .bar button:hover:not(:disabled) { background: #2e3440; color: #fff; }
  .bar button:disabled { opacity: .35; cursor: default; }
  .bar button.save { width: auto; padding: 0 12px; font-size: 12px; font-weight: 700; color: #1a1a1a; background: #f0a640; border-radius: 999px; }
  .bar button.save:hover:not(:disabled) { background: #f4b45c; color: #1a1a1a; }
  .bar button.save:disabled { background: none; color: #9aa1ad; opacity: 1; }
  .bar button[hidden] { display: none; }
  .title { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; color: #c9ced6; }
  .title b { color: #f0a640; font-weight: 700; margin-right: 6px; }
  .line { position: fixed; top: 0; bottom: 0; width: 3px; background: #f0a640; display: none; }
  body.dragging .line { display: block; }
</style>
</head>
<body>
  <div class="divider" id="divider" title="ドラッグして幅を変える"></div>
  <div class="bar">
    <button id="back" title="戻る">◀</button>
    <button id="fwd" title="進む">▶</button>
    <button id="reload" title="再読み込み">↻</button>
    <div class="title" id="title"><b>🎼 TAB譜</b><span></span></div>
    <button id="save" class="save" title="この曲を K-on practice の保存した動画に追加" hidden>＋ 保存</button>
    <button id="external" title="ふだんのブラウザで開く">↗</button>
    <button id="close" title="パネルを閉じる">✕</button>
  </div>
  <div class="line" id="line"></div>
<script>
  for (const id of ['back', 'fwd', 'reload', 'external', 'close', 'save']) document.getElementById(id).addEventListener('click', () => panel.cmd(id));
  const saveBtn = document.getElementById('save');
  panel.onSaved(saved => {
    saveBtn.hidden = saved === null;
    saveBtn.disabled = !!saved;
    saveBtn.textContent = saved ? '✓ 保存済み' : '＋ 保存';
  });
  panel.onState(st => {
    document.querySelector('#title span').textContent = (st.title || st.url || '').replace(/\s*\|\s*Songsterr.*$/, '');
    document.getElementById('back').disabled = !st.canBack;
    document.getElementById('fwd').disabled = !st.canFwd;
  });

  // 仕切りのドラッグ：押したらこの画面をウィンドウ全体に広げてもらい、離すまでマウスの位置を伝える
  const line = document.getElementById('line');
  let drag = false;
  document.getElementById('divider').addEventListener('pointerdown', e => {
    drag = true;
    panel.cmd('drag-start');
    e.preventDefault();
  });
  panel.onDrag(on => document.body.classList.toggle('dragging', on));
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    if (document.body.classList.contains('dragging')) { line.style.left = e.clientX + 'px'; panel.cmd('drag-move', e.clientX); }
    if (!(e.buttons & 1)) end();
  });
  const end = () => { if (!drag) return; drag = false; panel.cmd('drag-end'); };
  window.addEventListener('pointerup', end);
  window.addEventListener('blur', end);
</script>
</body>
</html>
